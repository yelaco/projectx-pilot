{{define "session-authorization"}}
<div class="fields"><label>Selected Practice account<input value="{{.PracticeAccountName}}" readonly><small>Account #{{.ExecutionConfig.AccountID}}. The server verifies the selected account; no retyping needed.</small></label>{{if not .PerTradeOnly}}<label>Verified fixed loss floor (balance dollars)<input name="floor" type="number" step="0.01" min="0.01" {{if .PracticeFloor}}value="{{.PracticeFloor}}"{{end}} required><small>The actual fixed account threshold, not the per-trade budget. Unknown/trailing floors remain unsupported.</small></label>{{end}}<label>Session hours<select name="session_mode" data-session-mode><option value="normal" {{if ne .SessionMode "custom"}}selected{{end}}>Normal session · automatic Chicago times</option><option value="custom" {{if eq .SessionMode "custom"}}selected{{end}}>Custom / early-close hours</option></select><small>Normal preset: opens previous day 17:00, last entry 15:00, exit reminder 15:05 Chicago. Confirm today's official instrument/holiday hours below.</small></label><label>Trading date (Chicago)<input name="session_date" type="date" value="{{.SessionDate}}" required></label></div><fieldset class="mapping-group" data-session-custom {{if ne .SessionMode "custom"}}disabled hidden{{end}}><legend>Custom hours · America/Chicago</legend><div class="fields"><label>Start allowing trades<input name="start" type="datetime-local" value="{{.SessionStart}}" required></label><label>Last new entry<input name="last_entry" type="datetime-local" value="{{.SessionLastEntry}}" required></label><label>Exit reminder<input name="flatten" type="datetime-local" value="{{.SessionFlatten}}" required></label></div><p class="footnote">Chicago timezone and daylight-saving offsets are handled automatically. Use earlier hours for holidays or products with earlier closure.</p></fieldset><div class="fields"><label>Current admin password<input name="current_password" type="password" autocomplete="current-password" required></label></div><label class="checkbox"><input name="practice_confirmed" value="yes" type="checkbox" required> This exact pinned account is my Practice account.</label><label class="checkbox"><input name="brackets_confirmed" value="yes" type="checkbox" required> Auto OCO Brackets are enabled for this account.</label>{{if not .PerTradeOnly}}<label class="checkbox"><input name="floor_confirmed" value="yes" type="checkbox" required> I verified this is the current fixed account loss floor; it will not trail during this session.</label>{{end}}<label class="checkbox"><input name="hours_confirmed" value="yes" type="checkbox" required> I verified the official contract and holiday schedule, including closure margins. This is an ordinary session accounted from the previous day at 17:00 Chicago; no merged holiday accounting applies.</label>
{{end}}
